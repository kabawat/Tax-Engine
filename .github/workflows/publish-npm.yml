name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with: fetch-depth: 0

      - name: Check package version change
        id: version
        env: BASE_SHA: ${{ github.event.before }}
        run: |
          current_version="$(node -p "require('./package.json').version")"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            previous_version="$(git show "$BASE_SHA:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => console.log(JSON.parse(input).version ?? ''))")"
          else
            previous_version=""
          fi

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version unchanged ($current_version); skipping npm publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Package version changed from '$previous_version' to '$current_version'."
          fi

      - name: Set up Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Verify and publish package
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
